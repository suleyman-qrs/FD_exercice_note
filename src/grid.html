<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Exercise Grid</title>
    <html lang="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Exercice Grid</h1>
    <main class="grid">
      <aside class="search-info-container">
        <h2>Search info</h2>

        <div class="seach-info">
          <p>From Geneva</p>
          <p>to San Francisco</p>
        </div>

          <p>From May 31 2027</p>
          <p>to 15 June 2027</p>
        </div>
        <p>1 passenger</p>
        <button class="btn">Reset search</button>
      </aside>
      <section class="card-result">
        <include src="components/card.html"></include>
        <include src="components/card.html"></include>
        <include src="components/card.html"></include>
        <include src="components/card.html"></include>
        <include src="components/card.html"></include>
        <include src="components/card.html"></include>
        <include src="components/card.html"></include>
        <include src="components/card.html"></include>
        <include src="components/card.html"></include>

        <div class="see-more">
          <button class="btn">See more results</button>
        </div>
      </section>
    </main>
  </body>
</html>
